openapi: 3.0.3
info:
  title: ride-service API
  version: '0.1.0'
  description: OpenAPI contract for the ride-service (create/match/accept/start/complete rides + health)
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /rides:
    post:
      summary: Create a new ride request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreate'
      responses:
        '200':
          description: Ride created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/{id}:
    get:
      summary: Get ride by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rides/{id}/accept:
    post:
      summary: Driver accepts ride
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride state updated to accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/{id}/start:
    post:
      summary: Start the ride
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride state updated to started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/{id}/complete:
    post:
      summary: Complete the ride
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride state updated to completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

components:
  schemas:
    RideCreate:
      type: object
      required: [passenger]
      properties:
        passenger:
          type: string
          example: "+237600000000"

    Ride:
      type: object
      properties:
        id:
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        passenger:
          type: string
          example: "+237600000000"
        driver:
          type: string
          nullable: true
          example: "+237699999999"
        state:
          type: string
          example: requested
        created_at:
          type: string
          format: date-time
          example: "2025-11-27T23:22:07Z"

    Error:
      type: object
      properties:
        error:
          type: string
          example: not_found
