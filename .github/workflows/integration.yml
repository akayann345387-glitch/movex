name: Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and start services
        run: |
          cd monorepo/infra
          docker compose up -d --build

      - name: Run integration script (PowerShell)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ../scripts/run-integration-test.ps1

      - name: Cleanup (ensure down)
        if: always()
        run: |
          cd monorepo/infra
          docker compose down -v
